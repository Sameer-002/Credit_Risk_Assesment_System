<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Risk Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><i></i><i></i></div>

<header class="top">
  <h1><span class="mark"></span>Credit risk check</h1>
  <p>Enter the loan application details and see how likely the borrower is to default.</p>
</header>

<main class="layout">
  <form id="form" class="panel form" novalidate>
    <fieldset>
      <legend>Borrower</legend>
      <label>Age
        <input type="number" name="person_age" min="18" max="100" value="28" required>
      </label>
      <label>Annual income (₹ / $)
        <input type="number" name="person_income" min="1" step="any" value="60000" required>
      </label>
      <label>Home ownership
        <select name="person_home_ownership">
          <option>RENT</option><option>OWN</option><option>MORTGAGE</option><option>OTHER</option>
        </select>
      </label>
      <label>Employment length (years)
        <input type="number" name="person_emp_length" min="0" step="any" value="4" required>
      </label>
    </fieldset>

    <fieldset>
      <legend>Loan</legend>
      <label>Purpose
        <select name="loan_intent">
          <option value="PERSONAL">Personal</option>
          <option value="EDUCATION">Education</option>
          <option value="MEDICAL">Medical</option>
          <option value="VENTURE">Venture</option>
          <option value="HOMEIMPROVEMENT">Home improvement</option>
          <option value="DEBTCONSOLIDATION">Debt consolidation</option>
        </select>
      </label>
      <label>Grade
        <select name="loan_grade">
          <option>A</option><option selected>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option>
        </select>
      </label>
      <label>Loan amount
        <input type="number" name="loan_amnt" min="1" step="any" value="10000" required>
      </label>
      <label>Interest rate (%)
        <input type="number" name="loan_int_rate" min="0" step="any" value="11.5" required>
      </label>
      <div class="calc">
        <span>Loan as share of income</span>
        <strong id="pct">0.17</strong>
        <small>Calculated for you</small>
      </div>
    </fieldset>

    <fieldset>
      <legend>Credit history</legend>
      <label>Previous default on file
        <div class="seg" role="radiogroup">
          <input type="radio" id="dN" name="cb_person_default_on_file" value="N" checked><label for="dN">No</label>
          <input type="radio" id="dY" name="cb_person_default_on_file" value="Y"><label for="dY">Yes</label>
        </div>
      </label>
      <label>Credit history length (years)
        <input type="number" name="cb_person_cred_hist_length" min="0" value="5" required>
      </label>
    </fieldset>

    <button id="go" type="submit"><span class="t">Check risk</span><span class="spin" aria-hidden="true"></span></button>
    <p id="err" class="err" role="alert" hidden></p>
  </form>

  <aside class="panel result" id="result" data-state="idle" aria-live="polite">
    <svg viewBox="0 0 220 130" class="dial" role="img" aria-label="Default probability gauge">
      <defs>
        <linearGradient id="g" x1="0" x2="1">
          <stop offset="0" stop-color="#0E9F8E"/><stop offset=".55" stop-color="#F0A202"/><stop offset="1" stop-color="#E5484D"/>
        </linearGradient>
      </defs>
      <path d="M 20 110 A 90 90 0 0 1 200 110" class="track" pathLength="100"/>
      <path id="arc" d="M 20 110 A 90 90 0 0 1 200 110" class="fill" pathLength="100"/>
      <g id="thr" class="thr" style="opacity:0"><line x1="110" y1="12" x2="110" y2="28"/></g>
      <g id="needle" class="needle"><line x1="110" y1="110" x2="110" y2="32"/><circle cx="110" cy="110" r="7"/></g>
      <text x="14" y="126" class="end">0%</text><text x="206" y="126" class="end" text-anchor="end">100%</text>
    </svg>

    <div class="big"><span id="prob">--</span><sup>%</sup></div>
    <p class="label">chance of default</p>
    <div id="verdict" class="verdict">Fill in the form to see a result</div>
    <p id="thrNote" class="note"></p>
  </aside>
</main>

<script src="script.js"></script>
</body>
</html>
